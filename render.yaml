# Render Blueprint for the NEURONET Rust backend.
# Create the service from the Render dashboard: New → Blueprint → this repo.
services:
  - type: web
    name: neuronet-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: RUST_LOG
        value: info
      - key: NEURONET_CORS_ORIGINS
        value: https://zakarbrnd-byte.github.io
