[package]
name = "neuronet-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NEURONET Mission Control backend — observatory API for the Digital Cell"

[[bin]]
name = "neuronet"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
