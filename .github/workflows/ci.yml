name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-foundation:
    name: Backend foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify required foundation paths
        run: |
          set -euo pipefail
          required=(
            README.md
            ROADMAP.md
            PHILOSOPHY.md
            ARCHITECTURE.md
            HYPOTHESES.md
            CONTRIBUTING.md
            CLAUDE.md
            LICENSE
            backend/Cargo.toml
            backend/src/main.rs
            backend/src/lib.rs
            frontend/package.json
            shared/README.md
            docs/README.md
          )
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Missing required foundation path: $path"
              exit 1
            fi
          done

      - name: Cargo check workspace
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  frontend-foundation:
    name: Frontend foundation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify frontend scaffold
        run: |
          set -euo pipefail
          test -f frontend/package.json
          test -d frontend/src/components
          test -d frontend/src/pages
          test -d frontend/src/layouts
          test -d frontend/src/services
          test -d frontend/src/hooks
          test -d frontend/src/types
          test -d frontend/src/assets
